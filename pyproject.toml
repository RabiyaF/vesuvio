[build-system]
requires = ["setuptools >= 71.0.0",
            "wheel",
            "versioningit"]
build-backend = "setuptools.build_meta"

[project]
name = "mvesuvio"
dynamic = ["version"]
authors = [
  {name = "The Mantid Project", email = "mantid-help@mantidproject.org"},
  {name = "Guilherme Pereira", email = "gui.maciel-pereira@stfc.ac.uk"},
]
description = "Analyse Vesuvio instrument data"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
# Only these few, package meant to be installed alongside vesuvio-dev.yml 
dependencies = [
    "iminuit",
    "jacobi",
    "dill",
]

[project.urls]
"Repository" = "https://github.com/mantidproject/vesuvio"
"Bug Tracker" = "https://github.com/mantidproject/vesuvio/issues"

[project.entry-points]
console_scripts = { mvesuvio = "mvesuvio.main:main" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"mvesuvio.default_config.ip_files" = ["*.par"]
"mvesuvio.default_config" = ["*.properties", "*.mplstyle"]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "./src"
]
testpaths = ["./tests"]
filterwarnings = ["error"]

[tool.coverage.run]
include = [
    "*/src/mvesuvio/*",
    "*/tools/calibration_scripts/*"
]

omit = [
    "*tests*",
    "*unpackaged*",
    "*legacy*",
    "*/src/mvesuvio/default_config/*",
    "*/src/mvesuvio/globals.py*",
    "*/src/mvesuvio/_version.py*"
]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_empty = true

[tool.versioningit.vcs]
method = "git"
default-tag = "0.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{version}.{distance}"
dirty = "{version}"
distance-dirty = "{version}.{distance}"

[tool.versioningit.write]
file = "src/mvesuvio/_version.py"

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
line-length = 140

[tool.ruff.format]
skip-magic-trailing-comma = false
line-ending = "auto"
