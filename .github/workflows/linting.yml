name: Linting

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ruff_linux:
    name: Ruff (linux)
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run check
        uses: chartboost/ruff-action@v1
        with:
          version: "0.17.5"
          args: "check"

      - name: Run format check
        uses: chartboost/ruff-action@v1
        with:
          version: "0.17.5"
          args: "format --check"